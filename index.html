<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hitit Üniversitesi | Akademik Yayın Portalı</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --hitit-bordo: #7a0026;
    --hitit-bordo-light: #9e0031;
    --bg-workspace: #1e1e1e;
    --bg-sidebar: #ffffff;
    --text-main: #2d3436;
    --border-color: #dfe6e9;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background-color: #f8f9fa;
    height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--text-main);
    overflow: hidden;
}

header {
    background: white;
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    border-bottom: 1px solid var(--border-color);
    z-index: 100;
}

.logo-area { display: flex; align-items: center; gap: 20px; }
.logo-area img { height: 45px; }
.logo-area div h1 { font-size: 16px; font-weight: 700; color: var(--hitit-bordo); }
.logo-area div p { font-size: 11px; text-transform: uppercase; color: #636e72; margin-top: 4px; letter-spacing: 1px; }

.main-layout { display: flex; flex: 1; overflow: hidden; }

.sidebar {
    width: 320px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border-color);
    overflow-y: auto;
}

.sidebar-header { padding: 25px; border-bottom: 1px solid var(--border-color); }
.sidebar-header h2 { font-size: 14px; font-weight: 800; color: #b2bec3; letter-spacing: 1px; }

.module-item {
    padding: 18px 25px;
    border-bottom: 1px solid #f1f2f6;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 15px;
}
.module-item:hover { background: #f9f9f9; padding-left: 30px; }
.module-item.active {
    background: #fff4f7;
    border-left: 4px solid var(--hitit-bordo);
    color: var(--hitit-bordo);
    font-weight: 600;
}

.workspace {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--bg-workspace);
    position: relative;
}

#viewport {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
    overflow: auto;
}

.spread-container {
    display: flex;
    gap: 4px;
    padding: 5px;
    transform-origin: center center;
    transition: transform 0.2s ease-out;
}

.page-wrap {
    position: relative;
}

canvas {
    max-width: 48vw;
    height: auto;
    max-height: 85vh;
    background: white;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.ann-layer {
    position: absolute;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    pointer-events: auto;
}

.ann-layer a {
    position: absolute;
}

.action-bar {
    height: 75px;
    background: rgba(255, 255, 255, 0.95);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
    border-top: 1px solid var(--border-color);
}

.group { display: flex; align-items: center; gap: 12px; }

.btn {
    background: #f1f2f6;
    border: none;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
}

.btn.primary { background: var(--hitit-bordo); color: white; }

.page-indicator {
    font-size: 13px;
    font-weight: 700;
    color: var(--hitit-bordo);
    min-width: 100px;
    text-align: center;
}

#loader {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    display: none;
}
</style>
</head>

<body oncontextmenu="return false">

<header>
    <div class="logo-area">
        <img src="https://hitit.edu.tr/images/HititLogoYeni.svg">
        <div>
            <h1>HİTİT ÜNİVERSİTESİ</h1>
            <p>HUZEM Kitaplığı</p>
        </div>
    </div>
    <div id="active-doc" style="font-size: 12px; font-weight: 600; color: #b2bec3;">Belge Seçiniz</div>
</header>

<div class="main-layout">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Yayın Kataloğu</h2>
        </div>
        <div id="catalog"></div>
    </div>

    <div class="workspace" id="viewer">
        <div id="viewport">
            <div id="loader">
                <p>Döküman İşleniyor...</p>
            </div>
            <div class="spread-container" id="spread">
                <div class="page-wrap">
                    <canvas id="left-pg"></canvas>
                    <div class="ann-layer" id="left-ann"></div>
                </div>
                <div class="page-wrap">
                    <canvas id="right-pg"></canvas>
                    <div class="ann-layer" id="right-ann"></div>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <div class="group">
                <button class="btn" onclick="prev()"><i class="fas fa-arrow-left"></i> ÖNCEKİ</button>
                <div class="page-indicator" id="pgInfo">0 / 0</div>
                <button class="btn" onclick="next()">SONRAKİ <i class="fas fa-arrow-right"></i></button>
            </div>

            <div class="group">
                <button class="btn" onclick="zoom(-0.2)">-</button>
                <span id="zoomVal">100%</span>
                <button class="btn" onclick="zoom(0.2)">+</button>
            </div>

            <div class="group">
                <button class="btn primary" onclick="toggleFull()">TAM EKRAN</button>
            </div>
        </div>
    </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdf = null, idx = 1, currentZoom = 1.0, isRendering = false;

const docs = [
    { title: "Modül 1: Yapay Zekâ ve Eğitim", file: "yz_modul1.pdf" },
    { title: "Modül 2: Yükseköğretimde Yapay Zekâ Destekli Öğretim", file: "yz_modul2.pdf" }
];

const catalog = document.getElementById("catalog");
docs.forEach(d => {
    const div = document.createElement("div");
    div.className = "module-item";
    div.innerHTML = `<i class="fas fa-file-invoice"></i> ${d.title}`;
    div.onclick = () => loadDoc(d.file, d.title, div);
    catalog.appendChild(div);
});

async function loadDoc(url, title, el) {
    document.querySelectorAll(".module-item").forEach(m => m.classList.remove("active"));
    el.classList.add("active");
    document.getElementById("active-doc").textContent = title.toUpperCase();
    document.getElementById("loader").style.display = "block";
    currentZoom = 1.0; applyZoom();

    pdf = await pdfjsLib.getDocument(url).promise;
    idx = 1;
    render();
}

async function draw(num, canvasId, annId) {
    const canvas = document.getElementById(canvasId);
    const annLayer = document.getElementById(annId);

    if (!num || num > pdf.numPages) {
        canvas.style.display = "none";
        annLayer.innerHTML = "";
        return;
    }

    canvas.style.display = "block";

    const page = await pdf.getPage(num);
    const dpr = window.devicePixelRatio || 1;
    const viewport = page.getViewport({ scale: 2.2 });

    const ctx = canvas.getContext("2d");
    canvas.height = viewport.height * dpr;
    canvas.width = viewport.width * dpr;
    ctx.scale(dpr, dpr);

    await page.render({ canvasContext: ctx, viewport }).promise;

    const annotations = await page.getAnnotations();
    annLayer.innerHTML = "";

    annotations.forEach(a => {
        if (a.subtype === "Link" && a.url) {
            const rect = pdfjsLib.Util.normalizeRect(a.rect);
            const view = viewport.convertToViewportRectangle(rect);

            const link = document.createElement("a");
            link.href = a.url;
            link.target = "_blank";
            link.style.left = Math.min(view[0], view[2]) + "px";
            link.style.top = Math.min(view[1], view[3]) + "px";
            link.style.width = Math.abs(view[0] - view[2]) + "px";
            link.style.height = Math.abs(view[1] - view[3]) + "px";

            annLayer.appendChild(link);
        }
    });
}

async function render() {
    if (isRendering) return;
    isRendering = true;
    document.getElementById("loader").style.display = "block";

    if (idx === 1) {
        document.getElementById("left-pg").style.display = "none";
        await draw(1, "right-pg", "right-ann");
        document.getElementById("pgInfo").textContent = `KAPAK / ${pdf.numPages}`;
    } else {
        await draw(idx, "left-pg", "left-ann");
        await draw(idx + 1, "right-pg", "right-ann");
        const end = Math.min(idx + 1, pdf.numPages);
        document.getElementById("pgInfo").textContent = `${idx}-${end} / ${pdf.numPages}`;
    }

    document.getElementById("loader").style.display = "none";
    isRendering = false;
}

function zoom(val) {
    currentZoom = Math.min(Math.max(0.6, currentZoom + val), 2.5);
    applyZoom();
}
function applyZoom() {
    document.getElementById("spread").style.transform = `scale(${currentZoom})`;
    document.getElementById("zoomVal").textContent = Math.round(currentZoom * 100) + "%";
}
function next() { if (idx === 1) idx = 2; else idx += 2; if(idx <= pdf.numPages) render(); }
function prev() { if (idx === 2) idx = 1; else idx -= 2; if(idx >= 1) render(); }

function toggleFull() {
    const v = document.getElementById("viewer");
    if (!document.fullscreenElement) v.requestFullscreen();
    else document.exitFullscreen();
}
</script>
</body>
</html>
